<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼轉盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#f97316',    // 橘色
                        'secondary': '#eab308',  // 黃色
                        'accent': '#ef4444',     // 紅色
                        'background': '#fefce8', // 米白色
                        'card': '#ffffff'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fefce8;
            color: #333;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* 轉盤容器，用於定位指針 */
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        /* 轉盤畫布，套用平滑旋轉動畫 */
        #wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 4s cubic-bezier(0.175, 0.885, 0.32, 1); /* 減速動畫 */
            border: 8px solid white;
        }

        /* 轉盤頂部的指針 */
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ef4444; /* 紅色指針 */
            z-index: 10;
            filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07));
        }

        /* 中心的圓點裝飾 */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 20%;
            background-color: white;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #f97316;
            border: 4px solid #fefce8;
        }
        
        .excluded-item {
            opacity: 0.5;
            text-decoration: line-through;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-primary text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-center">
            <h1 class="text-2xl font-bold tracking-wider"><i class="fas fa-utensils mr-2"></i>今天吃什麼轉盤</h1>
        </div>
    </header>

    <!-- 主要內容區：使用 CSS Grid，桌面版三欄，手機版單欄 -->
    <main class="container mx-auto p-4 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 mt-4">
        
        <!-- 左側：選項設定區 (佔 3 欄) -->
        <div class="lg:col-span-3 bg-card rounded-2xl shadow-lg p-5 flex flex-col h-full border-t-4 border-primary">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2"><i class="fas fa-list-ul mr-2 text-primary"></i>選項清單</h2>
            
            <!-- 新增選項表單 -->
            <form id="add-form" class="mb-4">
                <div class="flex flex-col gap-2">
                    <div class="flex">
                        <input type="text" id="new-item-input" placeholder="輸入餐廳或食物..." class="flex-grow border rounded-l-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <button type="submit" class="bg-primary hover:bg-orange-600 text-white px-4 py-2 rounded-r-lg transition-colors">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <!-- 新增選項時的分類標籤 -->
                    <div class="flex gap-1">
                        <select id="add-budget" class="flex-1 border rounded p-1 text-xs text-gray-600 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-primary">
                            <option value="any">預算: 不限</option>
                            <option value="cheap">銅板價</option>
                            <option value="normal">一般</option>
                            <option value="expensive">大餐</option>
                        </select>
                        <select id="add-dine" class="flex-1 border rounded p-1 text-xs text-gray-600 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-primary">
                            <option value="any">方式: 不限</option>
                            <option value="dine-in">內用</option>
                            <option value="takeout">外帶</option>
                            <option value="delivery">外送</option>
                        </select>
                        <select id="add-diet" class="flex-1 border rounded p-1 text-xs text-gray-600 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-primary">
                            <option value="any">偏好: 不限</option>
                            <option value="meat">葷食</option>
                            <option value="veg">素食</option>
                        </select>
                    </div>
                </div>
            </form>

            <!-- 預設快速選項 -->
            <div class="mb-4">
                <p class="text-xs text-gray-500 mb-2">快速加入：</p>
                <div class="flex flex-wrap gap-2">
                    <button class="quick-add-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs py-1 px-2 rounded transition-colors" data-name="便當">便當</button>
                    <button class="quick-add-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs py-1 px-2 rounded transition-colors" data-name="麵食">麵食</button>
                    <button class="quick-add-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs py-1 px-2 rounded transition-colors" data-name="火鍋">火鍋</button>
                    <button class="quick-add-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs py-1 px-2 rounded transition-colors" data-name="速食">速食</button>
                    <button class="quick-add-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs py-1 px-2 rounded transition-colors" data-name="自助餐">自助餐</button>
                </div>
            </div>

            <!-- 選項列表容器 -->
            <div class="flex-grow overflow-y-auto mb-4 border rounded-lg p-2 bg-gray-50 max-h-[300px] lg:max-h-none" id="items-list">
                <!-- 選項會透過 JS 動態產生在這裡 -->
            </div>

            <!-- 清除與重設按鈕 -->
            <div class="flex justify-between gap-2 mt-auto">
                <button id="clear-all-btn" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 rounded-lg text-sm transition-colors">
                    <i class="fas fa-trash-alt mr-1"></i>清空全部
                </button>
                <button id="reset-excluded-btn" class="w-1/2 bg-blue-100 hover:bg-blue-200 text-blue-700 py-2 rounded-lg text-sm transition-colors hidden">
                    <i class="fas fa-undo mr-1"></i>恢復排除
                </button>
            </div>
            <p id="list-status" class="text-xs text-gray-500 mt-2 text-center"></p>
        </div>

        <!-- 中間：轉盤區 (佔 6 欄) -->
        <div class="lg:col-span-6 flex flex-col items-center justify-center p-4">
            
            <!-- 轉盤實體 -->
            <div class="wheel-container mb-8">
                <div class="wheel-pointer"></div>
                <!-- 給定初始長寬，後續在 JS 調整 -->
                <canvas id="wheel-canvas" width="600" height="600"></canvas>
                <div class="wheel-center">EAT!</div>
            </div>

            <!-- 開始按鈕 -->
            <button id="spin-btn" class="bg-accent hover:bg-red-600 text-white font-bold text-xl py-4 px-12 rounded-full shadow-[0_6px_0_#b91c1c] active:shadow-[0_2px_0_#b91c1c] active:translate-y-1 transition-all transform hover:scale-105">
                開始抽選
            </button>

            <!-- 抽選結果顯示區 (預設隱藏) -->
            <div id="result-container" class="mt-8 bg-card rounded-2xl shadow-xl p-6 w-full max-w-md text-center hidden border-2 border-secondary animate-bounce-short">
                <h3 class="text-gray-500 text-sm mb-2">今天就吃...</h3>
                <p id="result-text" class="text-3xl font-bold text-primary mb-6"></p>
                
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <button id="accept-btn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg font-medium transition-colors flex-1">
                        <i class="fas fa-check-circle mr-1"></i>就吃這個
                    </button>
                    <button id="reject-btn" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded-lg font-medium transition-colors flex-1 text-sm">
                        <i class="fas fa-times-circle mr-1"></i>今天不想吃
                    </button>
                    <button id="redraw-btn" class="bg-secondary hover:bg-yellow-500 text-white py-2 px-4 rounded-lg font-medium transition-colors flex-1">
                        <i class="fas fa-sync-alt mr-1"></i>再抽一次
                    </button>
                </div>
            </div>
            
            <style>
                @keyframes bounce-short {
                    0% { transform: translateY(0); }
                    50% { transform: translateY(-10px); }
                    100% { transform: translateY(0); }
                }
                .animate-bounce-short {
                    animation: bounce-short 0.5s ease-in-out;
                }
            </style>
        </div>

        <!-- 右側：歷史紀錄與篩選 (佔 3 欄) -->
        <div class="lg:col-span-3 flex flex-col gap-6">
            
            <!-- (示意用) 篩選器區塊 -->
            <div class="bg-card rounded-2xl shadow-lg p-5 border-t-4 border-secondary hidden md:block">
                <h2 class="text-lg font-bold mb-3 text-gray-800"><i class="fas fa-filter mr-2 text-secondary"></i>進階篩選</h2>
                <div class="space-y-3 text-sm text-gray-600">
                    <div>
                        <label class="block text-xs font-semibold mb-1">預算</label>
                        <select id="filter-budget" class="w-full border rounded p-1.5 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-secondary">
                            <option value="all">不限</option>
                            <option value="cheap">銅板價 (100以內)</option>
                            <option value="normal">一般 (100~300)</option>
                            <option value="expensive">大餐 (300以上)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">用餐方式</label>
                        <select id="filter-dine" class="w-full border rounded p-1.5 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-secondary">
                            <option value="all">不限</option>
                            <option value="dine-in">內用</option>
                            <option value="takeout">外帶</option>
                            <option value="delivery">外送</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">飲食偏好</label>
                        <select id="filter-diet" class="w-full border rounded p-1.5 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-secondary">
                            <option value="all">不限</option>
                            <option value="meat">葷食</option>
                            <option value="veg">素食</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 用餐紀錄區塊 -->
            <div class="bg-card rounded-2xl shadow-lg p-5 flex flex-col h-full border-t-4 border-gray-400">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-history mr-2 text-gray-600"></i>最近紀錄</h2>
                    <button id="clear-history-btn" class="text-xs text-red-500 hover:text-red-700 hover:underline">清空</button>
                </div>
                
                <ul id="history-list" class="space-y-3 flex-grow overflow-y-auto max-h-[300px] lg:max-h-none pr-1">
                    <!-- 紀錄會動態產生 -->
                </ul>
            </div>
        </div>
    </main>

    <!-- 頁尾版權宣告 -->
    <footer class="bg-gray-800 text-gray-300 text-center py-4 mt-8 text-sm">
        <p>Copyright &copy; 2026 Wei-CHeng Chen. All Rights Reserved.</p>
    </footer>

    <!-- 通知訊息浮動視窗 (Toast) -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <script>
        // DOM 元素選取
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const itemInput = document.getElementById('new-item-input');
        const addForm = document.getElementById('add-form');
        const itemsList = document.getElementById('items-list');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const listStatus = document.getElementById('list-status');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const acceptBtn = document.getElementById('accept-btn');
        const rejectBtn = document.getElementById('reject-btn');
        const redrawBtn = document.getElementById('redraw-btn');
        const historyList = document.getElementById('history-list');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const resetExcludedBtn = document.getElementById('reset-excluded-btn');
        const quickAddBtns = document.querySelectorAll('.quick-add-btn');

        // 新增/篩選用的 DOM
        const addBudget = document.getElementById('add-budget');
        const addDine = document.getElementById('add-dine');
        const addDiet = document.getElementById('add-diet');
        const filterBudget = document.getElementById('filter-budget');
        const filterDine = document.getElementById('filter-dine');
        const filterDiet = document.getElementById('filter-diet');

        // 預設測資 (加入分類屬性)
        const defaultItems = [
            { id: 1, name: '雞腿便當', excluded: false, budget: 'normal', dine: 'takeout', diet: 'meat' },
            { id: 2, name: '牛肉麵', excluded: false, budget: 'normal', dine: 'dine-in', diet: 'meat' },
            { id: 3, name: '火鍋', excluded: false, budget: 'expensive', dine: 'dine-in', diet: 'meat' },
            { id: 4, name: '咖哩飯', excluded: false, budget: 'normal', dine: 'any', diet: 'meat' },
            { id: 5, name: '水餃', excluded: false, budget: 'cheap', dine: 'any', diet: 'meat' },
            { id: 6, name: '義大利麵', excluded: false, budget: 'normal', dine: 'dine-in', diet: 'meat' },
            { id: 7, name: '自助餐', excluded: false, budget: 'cheap', dine: 'any', diet: 'any' },
            { id: 8, name: '漢堡', excluded: false, budget: 'normal', dine: 'takeout', diet: 'meat' }
        ];

        // 轉盤配色版 (暖色系為主)
        const colors = [
            '#FF9F43', '#FF6B6B', '#48DBFB', '#1DD1A1', 
            '#F368E0', '#FF9F43', '#00D2D3', '#54A0FF',
            '#5F27CD', '#FF6B6B', '#1DD1A1', '#FECA57'
        ];

        // 狀態變數
        let items = [];
        let history = [];
        let currentRotation = 0; // 目前轉盤的旋轉角度
        let isSpinning = false;  // 是否正在旋轉
        let lastResultIndex = -1; // 上次抽中的索引

        // 初始化應用程式
        function init() {
            loadData();
            
            // 如果首次載入沒有資料，則寫入預設資料
            if (items.length === 0) {
                items = [...defaultItems];
                saveData();
            }
            
            renderItems();
            renderHistory();
            drawWheel();
            
            // 綁定事件監聽器
            addForm.addEventListener('submit', handleAddItem);
            clearAllBtn.addEventListener('click', handleClearAll);
            spinBtn.addEventListener('click', spinWheel);
            acceptBtn.addEventListener('click', handleAcceptResult);
            rejectBtn.addEventListener('click', handleRejectResult);
            redrawBtn.addEventListener('click', spinWheel); // 再抽一次就是重轉
            clearHistoryBtn.addEventListener('click', clearHistory);
            resetExcludedBtn.addEventListener('click', resetExcludedItems);

            // 綁定篩選器變更事件，當篩選改變時重新渲染選項與轉盤
            [filterBudget, filterDine, filterDiet].forEach(el => {
                if(el) {
                    el.addEventListener('change', () => {
                        renderItems();
                        drawWheel();
                    });
                }
            });

            // 綁定快速加入按鈕
            quickAddBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const name = btn.getAttribute('data-name');
                    addItem(name);
                });
            });

            // 視窗大小改變時重繪轉盤以確保文字清晰度
            window.addEventListener('resize', () => {
                if(!isSpinning) drawWheel();
            });
        }

        // 從 LocalStorage 載入資料
        function loadData() {
            const storedItems = localStorage.getItem('foodRouletteItems');
            const storedHistory = localStorage.getItem('foodRouletteHistory');
            
            if (storedItems) {
                try {
                    items = JSON.parse(storedItems);
                } catch (e) {
                    console.error("載入選項失敗", e);
                    items = [];
                }
            }
            
            if (storedHistory) {
                try {
                    history = JSON.parse(storedHistory);
                } catch (e) {
                    console.error("載入歷史失敗", e);
                    history = [];
                }
            }
        }

        // 儲存資料到 LocalStorage
        function saveData() {
            localStorage.setItem('foodRouletteItems', JSON.stringify(items));
        }

        function saveHistoryData() {
            localStorage.setItem('foodRouletteHistory', JSON.stringify(history));
        }

        // 顯示通知訊息 (Toast)
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // 根據類型設定顏色
            let bgColor = 'bg-gray-800';
            let icon = '<i class="fas fa-info-circle"></i>';
            if (type === 'error') { bgColor = 'bg-red-500'; icon = '<i class="fas fa-exclamation-circle"></i>'; }
            if (type === 'success') { bgColor = 'bg-green-500'; icon = '<i class="fas fa-check-circle"></i>'; }
            if (type === 'warning') { bgColor = 'bg-yellow-500'; icon = '<i class="fas fa-exclamation-triangle"></i>'; }

            toast.className = `${bgColor} text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 text-sm transition-opacity duration-300 opacity-0 transform translate-y-2`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // 動畫顯示
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            });

            // 3秒後移除
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 處理表單提交 (新增項目)
        function handleAddItem(e) {
            e.preventDefault();
            const name = itemInput.value.trim();
            addItem(name);
        }

        // 執行新增項目邏輯
        function addItem(name) {
            if (!name) {
                showToast('選項不能為空白！', 'error');
                return;
            }

            // 檢查重複 (不分大小寫)
            const isDuplicate = items.some(item => item.name.toLowerCase() === name.toLowerCase());
            if (isDuplicate) {
                showToast('這個選項已經在清單中了！', 'warning');
                itemInput.value = '';
                return;
            }

            // 新增項目
            const newItem = {
                id: Date.now(),
                name: name,
                excluded: false,
                budget: addBudget ? addBudget.value : 'any',
                dine: addDine ? addDine.value : 'any',
                diet: addDiet ? addDiet.value : 'any'
            };

            items.push(newItem);
            saveData();
            renderItems();
            drawWheel();
            
            // 清空輸入與分類
            itemInput.value = '';
            if (addBudget) addBudget.value = 'any';
            if (addDine) addDine.value = 'any';
            if (addDiet) addDiet.value = 'any';

            showToast(`已加入：${name}`, 'success');
        }

        // 刪除單一項目
        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveData();
            renderItems();
            drawWheel();
        }

        // 標記/取消排除項目 (用於清單中手動操作)
        function toggleExcludeItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.excluded = !item.excluded;
                saveData();
                renderItems();
                drawWheel();
            }
        }

        // 清空全部項目
        function handleClearAll() {
            // 不使用 confirm()，改用自訂 UI 或直接清空但可復原 (此處簡化為直接清空並提示)
            if (items.length === 0) return;
            
            items = [];
            saveData();
            renderItems();
            drawWheel();
            resultContainer.classList.add('hidden');
            showToast('已清空所有選項');
        }

        // 恢復所有被排除的項目
        function resetExcludedItems() {
            let changed = false;
            items.forEach(item => {
                if (item.excluded) {
                    item.excluded = false;
                    changed = true;
                }
            });
            
            if (changed) {
                saveData();
                renderItems();
                drawWheel();
                showToast('已恢復所有被排除的選項', 'success');
            }
        }

        // 渲染左側選項清單
        function renderItems() {
            itemsList.innerHTML = '';
            
            let excludedCount = 0;
            const activeItems = getActiveItems();

            if (items.length === 0) {
                itemsList.innerHTML = '<div class="text-center text-gray-400 py-8">清單是空的，請新增選項</div>';
                listStatus.textContent = '';
                resetExcludedBtn.classList.add('hidden');
                return;
            }

            const fBudget = filterBudget ? filterBudget.value : 'all';
            const fDine = filterDine ? filterDine.value : 'all';
            const fDiet = filterDiet ? filterDiet.value : 'all';

            items.forEach((item, index) => {
                if (item.excluded) excludedCount++;
                
                // 檢查是否被進階篩選隱藏
                let isFilteredOut = false;
                const iBudget = item.budget || 'any';
                const iDine = item.dine || 'any';
                const iDiet = item.diet || 'any';
                if (fBudget !== 'all' && iBudget !== 'any' && fBudget !== iBudget) isFilteredOut = true;
                if (fDine !== 'all' && iDine !== 'any' && fDine !== iDine) isFilteredOut = true;
                if (fDiet !== 'all' && iDiet !== 'any' && fDiet !== iDiet) isFilteredOut = true;

                const isInactive = item.excluded || isFilteredOut;

                const itemDiv = document.createElement('div');
                itemDiv.className = `flex justify-between items-center p-2 mb-2 rounded bg-white shadow-sm border-l-4 ${isInactive ? 'border-gray-300 opacity-60' : 'border-primary'}`;
                
                // 左側名稱、標籤與狀態
                const nameContainer = document.createElement('div');
                nameContainer.className = 'flex flex-col cursor-pointer flex-grow overflow-hidden';
                nameContainer.onclick = () => toggleExcludeItem(item.id); // 點擊文字切換排除狀態
                
                const topRow = document.createElement('div');
                topRow.className = 'flex items-center gap-2';

                const icon = document.createElement('i');
                if (item.excluded) {
                    icon.className = 'fas fa-eye-slash text-gray-400 text-xs';
                } else if (isFilteredOut) {
                    icon.className = 'fas fa-filter text-gray-400 text-xs';
                } else {
                    icon.className = 'fas fa-utensils text-primary text-xs';
                }
                
                const span = document.createElement('span');
                span.textContent = item.name;
                span.className = `font-medium truncate ${isInactive ? 'line-through text-gray-500' : 'text-gray-800'}`;
                
                topRow.appendChild(icon);
                topRow.appendChild(span);
                nameContainer.appendChild(topRow);

                // 標籤列 (顯示該項目的分類屬性)
                const tagsRow = document.createElement('div');
                tagsRow.className = 'flex gap-1 mt-1 text-[10px] text-gray-400 ml-5';
                
                const budgetLabel = { 'any': '', 'cheap': '銅板', 'normal': '一般', 'expensive': '大餐' }[iBudget] || '';
                const dineLabel = { 'any': '', 'dine-in': '內用', 'takeout': '外帶', 'delivery': '外送' }[iDine] || '';
                const dietLabel = { 'any': '', 'meat': '葷食', 'veg': '素食' }[iDiet] || '';
                
                [budgetLabel, dineLabel, dietLabel].forEach(l => {
                    if(l) {
                        const tag = document.createElement('span');
                        tag.className = 'bg-gray-100 px-1 rounded';
                        tag.textContent = l;
                        tagsRow.appendChild(tag);
                    }
                });
                
                if (tagsRow.childNodes.length > 0) {
                    nameContainer.appendChild(tagsRow);
                }

                // 右側刪除按鈕
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-gray-400 hover:text-red-500 transition-colors px-2 py-1 ml-2 flex-shrink-0';
                deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 避免觸發切換狀態
                    deleteItem(item.id);
                };

                itemDiv.appendChild(nameContainer);
                itemDiv.appendChild(deleteBtn);
                itemsList.appendChild(itemDiv);
            });

            // 更新狀態文字
            listStatus.textContent = `共 ${items.length} 個選項，參與抽選：${activeItems.length} 個`;
            
            // 處理「恢復排除」按鈕顯示
            if (excludedCount > 0) {
                resetExcludedBtn.classList.remove('hidden');
            } else {
                resetExcludedBtn.classList.add('hidden');
            }

            // 更新按鈕狀態
            spinBtn.disabled = activeItems.length < 2;
            if (activeItems.length < 2) {
                spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
                spinBtn.classList.remove('hover:bg-red-600', 'hover:scale-105', 'active:translate-y-1');
            } else {
                spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                spinBtn.classList.add('hover:bg-red-600', 'hover:scale-105', 'active:translate-y-1');
            }
        }

        // 取得有效 (未被排除) 的選項陣列
        function getActiveItems() {
            const fBudget = filterBudget ? filterBudget.value : 'all';
            const fDine = filterDine ? filterDine.value : 'all';
            const fDiet = filterDiet ? filterDiet.value : 'all';

            return items.filter(item => {
                // 如果被手動排除，直接忽略
                if (item.excluded) return false;

                // 檢查進階篩選條件
                const iBudget = item.budget || 'any';
                const iDine = item.dine || 'any';
                const iDiet = item.diet || 'any';

                // 如果篩選器不是'全部'，且該項目有指定分類(非'any')，則兩者必須吻合才保留
                if (fBudget !== 'all' && iBudget !== 'any' && fBudget !== iBudget) return false;
                if (fDine !== 'all' && iDine !== 'any' && fDine !== iDine) return false;
                if (fDiet !== 'all' && iDiet !== 'any' && fDiet !== iDiet) return false;

                return true;
            });
        }

        // 繪製轉盤
        function drawWheel() {
            const activeItems = getActiveItems();
            const numSegments = activeItems.length;
            
            // 處理畫布大小，確保解析度，加入防呆避免寬度為 0 導致負數半徑錯誤
            const size = canvas.parentElement.clientWidth || 300;
            canvas.width = size * 2; // Retina 螢幕優化
            canvas.height = size * 2;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            // 確保半徑至少為 1 (正數)，避免發生 IndexSizeError
            const radius = Math.max(1, Math.min(centerX, centerY) - 10);

            // 清空畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numSegments === 0) {
                // 沒有有效選項時畫個空的圓
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.font = '40px Noto Sans TC';
                ctx.fillStyle = '#94a3b8';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('請新增至少兩個選項', centerX, centerY);
                return;
            }

            if (numSegments === 1) {
                // 只有一個選項
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = colors[0];
                ctx.fill();
                ctx.font = 'bold 60px Noto Sans TC';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(activeItems[0].name, centerX, centerY);
                return;
            }

            // 繪製多個扇區
            const anglePerSegment = (2 * Math.PI) / numSegments;
            
            // 為了讓轉盤基準線在上方中心(12點鐘方向)，我們將繪製起點偏移 -90度 (-PI/2)
            // 這樣第0個元素的中心就會對齊指針
            // 但實際在計算角度時，通常是從右側(3點鐘, 0度)開始畫
            // 所以稍後在計算旋轉停止位置時，需考慮這個物理位置

            for (let i = 0; i < numSegments; i++) {
                const startAngle = i * anglePerSegment - (Math.PI / 2); // 從12點鐘開始畫
                const endAngle = startAngle + anglePerSegment;

                // 畫扇形
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                // 填色 (循環使用顏色陣列)
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                
                // 畫分隔線
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // 繪製文字
                ctx.save();
                ctx.translate(centerX, centerY);
                // 旋轉畫布到該扇區的中心線
                ctx.rotate(startAngle + anglePerSegment / 2);
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                
                // 根據文字長度調整字體大小和位置
                const text = activeItems[i].name;
                let fontSize = 40;
                if (text.length > 5) fontSize = 30;
                if (numSegments > 12) fontSize = 24;
                
                ctx.font = `bold ${fontSize}px Noto Sans TC`;
                
                // 繪製文字，加上陰影增加辨識度
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                // 將文字畫在半徑的 85% 處
                ctx.fillText(text, radius * 0.85, 0);
                ctx.restore();
            }
        }

        // 執行轉盤旋轉
        function spinWheel() {
            const activeItems = getActiveItems();
            
            // 防呆檢查
            if (activeItems.length < 2) {
                showToast('至少需要兩個有效的選項才能轉動！', 'warning');
                return;
            }
            if (isSpinning) return;

            // 初始化狀態
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');
            resultContainer.classList.add('hidden'); // 隱藏結果區

            // 1. 隨機決定中獎項目
            const winningIndex = Math.floor(Math.random() * activeItems.length);
            lastResultIndex = winningIndex;
            const winningItem = activeItems[winningIndex];

            // 2. 計算旋轉角度
            const numSegments = activeItems.length;
            const segmentAngle = 360 / numSegments; // 每個扇區佔幾度
            
            // 目標：讓選中的扇區中心對準正上方 (12點鐘方向)。
            // 在 drawWheel 中，第 0 個扇區的開始角度是 -90 度 (12點鐘)。
            // 第 i 個扇區的中心角度(相對於12點鐘) 是 i * segmentAngle + (segmentAngle/2)
            // 為了讓它對準指針(正上方不動)，轉盤需要「逆時針」轉回去這個角度。
            // 但我們是用 CSS transform: rotate()，正值是順時針。
            // 因此，如果要讓第 i 個扇區到頂部，需要的旋轉角度是： 360 - 扇區中心角度。
            
            const targetSegmentCenterAngle = winningIndex * segmentAngle + (segmentAngle / 2);
            // 加上一些隨機偏移，讓指針不要每次都指在正中央，看起來更自然
            const randomOffset = (Math.random() - 0.5) * (segmentAngle * 0.8); // 限制在扇區內的 80% 範圍
            
            // 計算這一次要轉的相對度數 (要補齊的角度)
            const angleToWin = 360 - (targetSegmentCenterAngle + randomOffset);

            // 計算總旋轉角度 (目前的角度 + 多轉幾圈(例如5圈) + 計算出的目標角度)
            // 為了讓動畫連續，我們必須在 currentRotation 的基礎上往上加
            
            // 先計算目前角度除以 360 剩下的餘數
            const currentMod = currentRotation % 360; 
            // 多轉 5 圈 (1800度) 增加刺激感
            const extraSpins = 360 * 5; 
            
            // 下一次的總角度 = 舊角度 - 舊餘數 (歸零到最近的360倍數) + 多圈 + 目標角度
            const targetRotation = currentRotation - currentMod + extraSpins + angleToWin;

            // 3. 套用 CSS 動畫
            canvas.style.transform = `rotate(${targetRotation}deg)`;
            currentRotation = targetRotation;

            // 4. 動畫結束後的處理 (與 CSS transition 時間對齊 4000ms)
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.classList.remove('opacity-50');
                
                // 顯示結果
                showResult(winningItem);
            }, 4000);
        }

        // 顯示結果畫面
        function showResult(item) {
            resultText.textContent = item.name;
            resultContainer.classList.remove('hidden');
            
            // 儲存目前顯示的項目 ID，供「不想吃」按鈕使用
            resultContainer.dataset.itemId = item.id;
            
            // 捲動畫面讓結果可見 (特別是在手機版)
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            showToast(`抽中囉！今天吃 ${item.name}`, 'success');
        }

        // 點擊「就吃這個」(接受結果)
        function handleAcceptResult() {
            const itemId = parseInt(resultContainer.dataset.itemId);
            const item = items.find(i => i.id === itemId);
            
            if (item) {
                // 寫入歷史紀錄
                addHistory(item.name);
                
                resultContainer.classList.add('hidden');
                showToast(`已記錄：${item.name}`, 'success');
                
                // 可選：播放撒花動畫 (此處簡化省略，交由 UI 變化處理)
            }
        }

        // 點擊「今天不想吃」(拒絕結果)
        function handleRejectResult() {
            const itemId = parseInt(resultContainer.dataset.itemId);
            const item = items.find(i => i.id === itemId);
            
            if (item) {
                // 標記為排除
                item.excluded = true;
                saveData();
                renderItems();
                drawWheel();
                
                resultContainer.classList.add('hidden');
                
                // 檢查是否還有足夠選項
                const activeItems = getActiveItems();
                if (activeItems.length >= 2) {
                    showToast(`已暫時排除「${item.name}」，幫您重抽...`, 'info');
                    // 延遲一點點自動重抽
                    setTimeout(() => {
                        spinWheel();
                    }, 800);
                } else {
                    showToast(`已排除「${item.name}」。有效選項不足，請新增選項或恢復排除！`, 'error');
                }
            }
        }

        // 新增歷史紀錄
        function addHistory(itemName) {
            const now = new Date();
            // 格式化日期：MM/DD HH:mm
            const dateStr = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            const record = {
                id: Date.now(),
                name: itemName,
                time: dateStr
            };
            
            // 加到陣列開頭
            history.unshift(record);
            
            // 限制最多 10 筆
            if (history.length > 10) {
                history = history.slice(0, 10);
            }
            
            saveHistoryData();
            renderHistory();
        }

        // 渲染歷史紀錄清單
        function renderHistory() {
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = '<li class="text-center text-gray-400 py-4 text-sm">尚無紀錄</li>';
                return;
            }
            
            history.forEach(record => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100 shadow-sm';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'font-bold text-gray-800 text-lg flex items-center gap-2';
                nameDiv.innerHTML = `<span class="w-2 h-2 rounded-full bg-secondary inline-block"></span>${record.name}`;
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'text-xs text-gray-500';
                timeDiv.textContent = record.time;
                
                li.appendChild(nameDiv);
                li.appendChild(timeDiv);
                historyList.appendChild(li);
            });
        }

        // 清空歷史紀錄
        function clearHistory() {
            if (history.length === 0) return;
            history = [];
            saveHistoryData();
            renderHistory();
            showToast('已清空用餐紀錄');
        }

        // 頁面載入完成後啟動
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
